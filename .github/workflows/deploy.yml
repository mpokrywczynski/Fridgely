name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, tokenizer, xml, ctype, json, bcmath

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Generate setup.php
        id: setup
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          sed "s/%%TOKEN%%/$TOKEN/" .github/setup-template.php > public/setup.php
          echo "deploy-test-ok" > public/deploy-test.txt
          echo "setup.php + deploy-test.txt generated"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.SFTP_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            vendor/**
            .env
            .env.*
            .claude/**
            storage/logs/**
            storage/framework/sessions/**
            storage/framework/cache/**
            storage/framework/views/**

      - name: Run setup.php on server
        run: |
          echo "=== Step 1: Check deploy-test.txt (confirms upload + web server) ==="
          TXT_CODE=$(curl -s -o /tmp/txt_response.txt -w "%{http_code}" --max-time 30 \
            "${{ secrets.APP_URL }}/deploy-test.txt")
          echo "deploy-test.txt HTTP status: $TXT_CODE"
          echo "deploy-test.txt content: $(cat /tmp/txt_response.txt)"

          echo ""
          echo "=== Step 2: Check if setup.php exists (HEAD request) ==="
          HEAD_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -I \
            "${{ secrets.APP_URL }}/setup.php")
          echo "setup.php HEAD status: $HEAD_CODE"

          echo ""
          echo "=== Step 3: Trigger setup.php ==="
          HTTP_CODE=$(curl -s -o /tmp/setup_response.txt -w "%{http_code}" \
            --max-time 90 -v \
            "${{ secrets.APP_URL }}/setup.php?token=${{ steps.setup.outputs.token }}" 2>&1 | tee /tmp/setup_verbose.txt | tail -1)
          HTTP_CODE=$(curl -s -o /tmp/setup_response.txt -w "%{http_code}" --max-time 90 \
            "${{ secrets.APP_URL }}/setup.php?token=${{ steps.setup.outputs.token }}")
          RESPONSE=$(cat /tmp/setup_response.txt)
          echo "HTTP status: $HTTP_CODE"
          echo "Response: $RESPONSE"

          if [ "$TXT_CODE" != "200" ]; then
            echo "::warning::deploy-test.txt not found (HTTP $TXT_CODE) - upload may have failed or APP_URL is wrong"
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Setup failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Deploy complete."
