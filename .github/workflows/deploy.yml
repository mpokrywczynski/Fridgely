name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, tokenizer, xml, ctype, json, bcmath

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create deploy archive
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "vendor/*" \
            -x ".env" \
            -x ".env.*" \
            -x ".claude/*" \
            -x "storage/logs/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/views/*" \
            -x "deploy.zip"
          echo "Archive: $(du -sh deploy.zip | cut -f1)"

      - name: Upload archive to server
        run: |
          HTTP_CODE=$(curl -s -o /tmp/recv_response.txt -w "%{http_code}" \
            --max-time 120 \
            -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
            -F "archive=@deploy.zip" \
            "${{ secrets.APP_URL }}/deploy-receiver.php")
          RESPONSE=$(cat /tmp/recv_response.txt)
          echo "HTTP: $HTTP_CODE | $RESPONSE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Upload failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Run setup (migrate + cache)
        run: |
          HTTP_CODE=$(curl -s -o /tmp/setup_response.txt -w "%{http_code}" \
            --max-time 120 \
            -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
            "${{ secrets.APP_URL }}/setup.php")
          RESPONSE=$(cat /tmp/setup_response.txt)
          echo "HTTP: $HTTP_CODE"
          echo "$RESPONSE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Setup failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Deploy complete."
