name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, tokenizer, xml, ctype, json, bcmath

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Generate setup.php with one-time token
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "DEPLOY_TOKEN=$TOKEN" >> $GITHUB_ENV
          sed "s/%%TOKEN%%/$TOKEN/" .github/setup-template.php > public/setup.php

      - name: Deploy via SFTP (lftp)
        run: |
          sudo apt-get install -y lftp -qq
          lftp -c "
          set sftp:auto-confirm yes
          set net:max-retries 5
          set net:timeout 60
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 2
          set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no'
          open -u '${{ secrets.SFTP_USER }}','${{ secrets.SFTP_PASSWORD }}' sftp://${{ secrets.SFTP_HOST }}
          mirror --reverse --delete --no-perms \
            --exclude-glob .git \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob node_modules/ \
            --exclude-glob vendor/ \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob .claude/ \
            --exclude-glob storage/logs/ \
            --exclude-glob storage/framework/sessions/ \
            --exclude-glob storage/framework/cache/ \
            --exclude-glob storage/framework/views/ \
            ./ ${{ secrets.SFTP_PATH }}
          bye
          "

      - name: Run setup.php on server
        run: |
          echo "Triggering setup..."
          HTTP_CODE=$(curl -s -o /tmp/setup_response.txt -w "%{http_code}" --max-time 60 \
            "${{ secrets.APP_URL }}/setup.php?token=${{ env.DEPLOY_TOKEN }}")
          RESPONSE=$(cat /tmp/setup_response.txt)
          echo "HTTP status: $HTTP_CODE"
          echo "Response: $RESPONSE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Setup script failed with HTTP $HTTP_CODE"
            exit 1
          fi
          if echo "$RESPONSE" | grep -qi "Fatal\|Parse error\|Warning.*Fatal"; then
            echo "::error::PHP error in setup script"
            exit 1
          fi
          echo "Deploy complete."
