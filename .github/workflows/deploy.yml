name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, tokenizer, xml, ctype, json, bcmath

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Test SFTP connection + path
        run: |
          sudo apt-get install -y lftp -qq
          echo "=== Testing SFTP with lftp ==="
          lftp -c "
          set sftp:auto-confirm yes
          set net:max-retries 1
          set net:timeout 30
          set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no'
          open -u '${{ secrets.SFTP_USER }}','${{ secrets.SFTP_PASSWORD }}' sftp://${{ secrets.SFTP_HOST }}
          echo '--- Root listing ---'
          ls
          echo '--- SFTP_PATH listing ---'
          ls ${{ secrets.SFTP_PATH }}
          bye
          " && echo "SFTP OK" || echo "SFTP FAILED (exit $?)"

      - name: Deploy via SFTP (lftp)
        run: |
          lftp -c "
          set sftp:auto-confirm yes
          set net:max-retries 5
          set net:timeout 60
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 2
          set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no'
          open -u '${{ secrets.SFTP_USER }}','${{ secrets.SFTP_PASSWORD }}' sftp://${{ secrets.SFTP_HOST }}
          mirror --reverse --delete --no-perms \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob node_modules/ \
            --exclude-glob vendor/ \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob .claude/ \
            --exclude-glob storage/logs/ \
            --exclude-glob storage/framework/sessions/ \
            --exclude-glob storage/framework/cache/ \
            --exclude-glob storage/framework/views/ \
            ./ ${{ secrets.SFTP_PATH }}

          bye
          "

      - name: Clear Laravel cache on server
        run: |
          sudo apt-get install -y sshpass -qq
          sshpass -p '${{ secrets.SFTP_PASSWORD }}' sftp \
            -o StrictHostKeyChecking=no \
            -o BatchMode=no \
            '${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}' << 'SFTP_EOF'
          -rm /domains/fridgely.krywapo.kylos.pl/bootstrap/cache/routes-v7.php
          -rm /domains/fridgely.krywapo.kylos.pl/bootstrap/cache/config.php
          -rm /domains/fridgely.krywapo.kylos.pl/bootstrap/cache/packages.php
          -rm /domains/fridgely.krywapo.kylos.pl/bootstrap/cache/services.php
          quit
          SFTP_EOF
          echo "Cache cleared"

      - name: Run post-deploy setup
        run: |
          echo "Triggering deploy-run..."
          HTTP_CODE=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" --max-time 90 \
            "${{ secrets.APP_URL }}/deploy-run?token=${{ secrets.DEPLOY_TOKEN }}")
          RESPONSE=$(cat /tmp/deploy_response.txt)
          echo "HTTP status: $HTTP_CODE"
          echo "Response: $RESPONSE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Deploy setup failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Deploy complete."
