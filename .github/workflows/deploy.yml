name: Build & Deploy

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, tokenizer, xml, ctype, json, bcmath

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Generate setup.php with one-time token
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "DEPLOY_TOKEN=$TOKEN" >> $GITHUB_ENV
          sed "s/%%TOKEN%%/$TOKEN/" .github/setup-template.php > public/setup.php

      - name: Deploy via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.SFTP_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/.env.*
            **/.claude/**
            **/storage/logs/**
            **/storage/framework/sessions/**
            **/storage/framework/cache/**
            **/storage/framework/views/**

      - name: Run setup.php on server
        run: |
          echo "Triggering setup..."
          RESPONSE=$(curl -sf --max-time 60 \
            "${{ secrets.APP_URL }}/setup.php?token=${{ env.DEPLOY_TOKEN }}" \
            || echo "FAILED")
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -qi "FAILED\|Forbidden\|Fatal\|Error"; then
            echo "::error::Setup script failed"
            exit 1
          fi
          echo "Deploy complete."
