name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, tokenizer, xml, ctype, json, bcmath

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare archive
        run: echo "Building deploy archive..."

      - name: Create deploy archive
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "vendor/*" \
            -x ".env" \
            -x ".env.*" \
            -x ".claude/*" \
            -x "storage/logs/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/views/*" \
            -x "deploy.zip"
          echo "Archive size: $(du -sh deploy.zip | cut -f1)"

      - name: Deploy via HTTP
        run: |
          HTTP_CODE=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
            -F "archive=@deploy.zip" \
            "${{ secrets.APP_URL }}/deploy-receiver.php")
          RESPONSE=$(cat /tmp/deploy_response.txt)
          echo "HTTP status: $HTTP_CODE"
          echo "Response: $RESPONSE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Deploy failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Deploy complete."
